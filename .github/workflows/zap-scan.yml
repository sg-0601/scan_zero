name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Website / API URL to scan'
        required: true
        default: 'https://your-app.onrender.com'
  schedule:
    - cron: '0 0 * * 0' # Har Sunday raat 12:00 baje automatically scan chalega

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run OWASP ZAP Scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ZAP Baseline Scan (Fast, Safe for Render, Low Resource)
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url || 'https://your-app.onrender.com' }}
          issue_title: 'OWASP ZAP Security Scan Report'
          fail_action: false # Warnings/Alerts milne par bhi build fail nahi hogi

      # HTML Report ko as an Artifact save karein
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-audit-report
          path: zap_report.html
          retention-days: 30
