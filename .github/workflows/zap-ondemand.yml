name: On-Demand ZAP Scanner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target website to scan'
        required: true
      scan_id:
        description: 'Scan ID from ScanZero'
        required: true
      callback_url:
        description: 'Render backend callback URL'
        required: false
        default: ''

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run ZAP Scan in Cloud
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Workspace Permissions
        run: |
          mkdir -p ${{ github.workspace }}/wrk
          chmod -R 777 ${{ github.workspace }}

      # ZAP Baseline Scan in 7GB Cloud Runner
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ github.event.inputs.target_url }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-J zap_report.json -r zap_report.html -m 2 -I'

      # Send Results Back to Render Backend via Callback
      - name: Send Results Back to Render Callback
        if: always()
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          SCAN_ID: ${{ github.event.inputs.scan_id }}
        run: |
          python -c '
          import os, json, urllib.request

          callback = os.environ.get("CALLBACK_URL", "").strip()
          scan_id = os.environ.get("SCAN_ID", "").strip()

          if callback and callback != "null":
              print(f"Posting scan results for {scan_id} to {callback}...")
              report = {}
              candidates = [
                  "zap_report.json",
                  "wrk/zap_report.json",
                  os.path.join(os.getcwd(), "zap_report.json"),
                  os.path.join(os.getcwd(), "wrk", "zap_report.json")
              ]
              for candidate in candidates:
                  if os.path.exists(candidate):
                      try:
                          with open(candidate, "r", encoding="utf-8") as f:
                              report = json.load(f)
                              print(f"Successfully loaded report from {candidate}")
                              break
                      except Exception as err:
                          print(f"Error reading {candidate}: {err}")

              if not report:
                  for root, dirs, files in os.walk(os.getcwd()):
                      for fname in files:
                          if fname.endswith(".json") and "zap" in fname.lower():
                              p = os.path.join(root, fname)
                              try:
                                  with open(p, "r", encoding="utf-8") as f:
                                      report = json.load(f)
                                      print(f"Discovered ZAP report via walk: {p}")
                                      break
                              except Exception:
                                  pass
                      if report:
                          break

              payload = json.dumps({"scan_id": scan_id, "report": report}).encode("utf-8")
              req = urllib.request.Request(
                  callback,
                  data=payload,
                  headers={"Content-Type": "application/json", "User-Agent": "ScanZero-GitHub-Runner"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      print(f"Callback successful. HTTP status: {res.status}")
              except Exception as e:
                  print(f"Callback response / notification: {e}")
          else:
              print("No valid callback URL provided. Skipping callback.")
          '

      # Save HTML and JSON reports as Artifact for manual review
      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: zap-report-${{ github.event.inputs.scan_id }}
          path: |
            **/zap_report.html
            **/zap_report.json
          retention-days: 7
